name: Build with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build with Docker
      run: |
        docker build -f Dockerfile.ci -t global-radio:ci .
        docker create --name global-radio-build global-radio:ci
        docker cp global-radio-build:/app/dist ./dist
        docker rm global-radio-build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
