name: Full Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Update version
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Install dependencies (including dev)
        run: |
          export NODE_ENV=development
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --registry https://registry.npmmirror.com --fetch-retries=3

      - name: Build Web
        run: npm run build

      - name: Verify build
        run: |
          ls -la dist/
          test -f dist/index.html || exit 1
          echo "✅ Web build successful!"

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-electron:
    name: Build Electron Windows
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Update version
        shell: pwsh
        run: |
          $VERSION = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag }}" }
          $VERSION = $VERSION -replace '^v', ''
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install dependencies (including dev)
        shell: pwsh
        run: |
          $env:NODE_ENV = 'development'
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install --legacy-peer-deps --registry https://registry.npmmirror.com --fetch-retries=3

      - name: Build Electron main process
        shell: pwsh
        run: npm run build:electron:main

      - name: Build Electron Windows
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-win
          path: dist-electron/*.exe

    build-android:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Update version
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      - name: Install dependencies
        run: |
          export NODE_ENV=development
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --registry https://registry.npmmirror.com --fetch-retries=3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Init Capacitor
        run: npx cap init global-radio com.globalradio.app

      - name: Remove existing android and add platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # 🔑 关键：从 Secret 还原固定签名密钥
      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Android APK (Release signed)
        run: |
          cd android
          chmod +x gradlew
          # 设置签名环境变量，供 build.gradle 使用
          export KEYSTORE_FILE=app/release.keystore
          export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
  publish-docker:
    name: Publish Docker Image
    needs: build-web
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker credentials
        id: check
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags)
        if: steps.check.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/global-radio
          tags: |
            type=raw,value=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: steps.check.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts/ -type f | head -20

      - name: Determine release tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: |
            artifacts/electron-win/*.exe
            artifacts/android-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
