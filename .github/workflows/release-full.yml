name: Full Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Update version
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Install dependencies
        run: |
          export NODE_ENV=development
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --registry https://registry.npmmirror.com --fetch-retries=3

      - name: Build Web
        run: npm run build

      - name: Verify build
        run: |
          ls -la dist/
          test -f dist/index.html || exit 1
          echo "✅ Web build successful!"

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-electron:
    name: Build Electron Windows
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Update version
        shell: pwsh
        run: |
          $VERSION = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag }}" }
          $VERSION = $VERSION -replace '^v', ''
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:NODE_ENV = 'development'
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install --legacy-peer-deps --registry https://registry.npmmirror.com --fetch-retries=3

      - name: Build Electron main process
        shell: pwsh
        run: npm run build:electron:main

      - name: Build Electron Windows
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-win
          path: dist-electron/*.exe

  build-android:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Update version
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      - name: Install dependencies
        run: |
          export NODE_ENV=development
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --registry https://registry.npmmirror.com --fetch-retries=3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Init Capacitor
        run: npx cap init global-radio com.globalradio.app

      - name: Remove existing android and add platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # 🔑 解码签名密钥
      - name: Decode keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Keystore is empty!"
            exit 1
          fi
          echo "✅ Keystore decoded"

      # 临时：在 build.gradle 中直接写入 keystore 密码（便于调试），后续可改回环境变量
      - name: Generate build.gradle with embedded signing config (temporary)
        run: |
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace "com.globalradio.app"
              compileSdk rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "com.globalradio.app"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "2.0.3"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
          }
          repositories {
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }
          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }
          apply from: 'capacitor.build.gradle'
          EOF

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ✅ 验证 APK 是否有效
      - name: Verify APK integrity
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "APK file size: $(stat -c%s $APK_PATH) bytes"
          file $APK_PATH
          # 使用 aapt 检查包信息（若可用）
          if command -v aapt &> /dev/null; then
            aapt dump badging $APK_PATH | head -10
          else
            echo "aapt not found, skipping dump"
          fi
          # 使用 jarsigner 验证签名（即使失败也不退出）
          jarsigner -verify -verbose -certs $APK_PATH || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  publish-docker:
    name: Publish Docker Image
    needs: build-web
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker credentials
        id: check
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags)
        if: steps.check.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/global-radio
          tags: |
            type=raw,value=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: steps.check.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts/ -type f | head -20

      - name: Determine release tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: |
            artifacts/electron-win/*.exe
            artifacts/android-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
