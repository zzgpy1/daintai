name: 🚀 Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install and Build
      run: |
        npm cache clean --force
        rm -rf node_modules package-lock.json
        npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        npx vite build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  # 方案 1：使用 peaceiris/actions-gh-pages（最兼容）
  deploy-gh-pages-legacy:
    name: 🌐 Deploy with peaceiris (Compatible)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Deploy to gh-pages branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
      continue-on-error: false

  # 方案 2：使用官方 Pages 部署（需要在 Settings 中启用 Pages）
  deploy-official-pages:
    name: 🌐 Deploy to GitHub Pages (Official)
    runs-on: ubuntu-latest
    needs: [build, deploy-gh-pages-legacy]
    if: github.ref == 'refs/heads/main' && always()
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true

  # 方案 3：使用上传-release 作为备选
  upload-release:
    name: 📤 Upload as Release Asset
    runs-on: ubuntu-latest
    needs: [build, deploy-gh-pages-legacy]
    if: github.ref == 'refs/heads/main' && always()
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Create archive
      run: |
        cd dist
        zip -r ../dist.zip .
        cd ..
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload as artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-zip
        path: dist.zip
