name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  release-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Clean npm cache
      run: |
        npm cache clean --force
        rm -rf node_modules
        rm -f package-lock.json
    
    - name: Install dependencies
      run: |
        npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    
    - name: Build
      run: |
        npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        VITE_APP_VERSION: ${{ github.ref_name }}
    
    - name: Upload Web artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: dist/
        retention-days: 7
    
    - name: Deploy to GitHub Pages
      if: github.ref_type == 'tag'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true

  release-desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Clean npm cache
      run: |
        npm cache clean --force
        rm -rf node_modules
        rm -f package-lock.json
    
    - name: Install dependencies
      run: |
        npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    
    - name: Build
      run: |
        npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
    
    - name: Build Electron
      run: |
        npm run electron:build -- --publish never
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Desktop artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.os }}
        path: release/
        retention-days: 7

  release-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Clean npm cache
      run: |
        npm cache clean --force
        rm -rf node_modules
        rm -f package-lock.json
    
    - name: Install dependencies
      run: |
        npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34'
    
    - name: Build
      run: |
        npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 7

  release-docker:
    runs-on: ubuntu-latest
    needs: [release-web]
    if: github.ref_type == 'tag'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download web artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: dist/
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/global-radio:latest
          ${{ secrets.DOCKER_USERNAME }}/global-radio:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    runs-on: ubuntu-latest
    needs: [release-web, release-desktop, release-android, release-docker]
    if: github.ref_type == 'tag'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: List artifacts
      run: ls -la artifacts/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
