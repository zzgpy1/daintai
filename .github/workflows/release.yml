name: 📦 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Release Name'
        required: true
        default: 'Release v1.0.0'
        type: string

env:
  NODE_VERSION: 20
  NODE_OPTIONS: --max-old-space-size=4096
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ============ Web 构建 ============
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build Web
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ github.ref_name || github.event.inputs.tag_name }}

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ============ Android 构建 ============
  build-android:
    name: 📱 Build Android
    runs-on: ubuntu-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34'

      - name: Verify Android project structure
        run: |
          echo "Checking Android project structure:"
          ls -la android/
          ls -la android/app/
          ls -la android/gradle/wrapper/ || echo "gradle/wrapper directory not found"

      - name: Create gradle wrapper if missing
        run: |
          cd android
          if [ ! -d "gradle/wrapper" ]; then
            mkdir -p gradle/wrapper
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.2/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f "gradlew" ]; then
            cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
            chmod +x gradlew
          fi
          if [ ! -f "gradlew.bat" ]; then
            cat > gradlew.bat << 'EOF'
          @if "%DEBUG%" == "" @echo off
          @rem ##########################################################################
          @rem
          @rem  Gradle startup script for Windows
          @rem
          @rem ##########################################################################
          set DIRNAME=%~dp0
          set APP_BASE_NAME=%~n0
          set APP_HOME=%DIRNAME%
          @rem Resolve any "." and ".." in APP_HOME to make it shorter.
          for %%i in ("%APP_HOME%") do set APP_HOME=%%~fi
          @rem Add default JVM options here. You can also use JAVA_OPTS and GRADLE_OPTS to pass JVM options to this script.
          set DEFAULT_JVM_OPTS="-Xmx64m" "-Xms64m"
          @rem Find java.exe
          if defined JAVA_HOME goto findJavaFromJavaHome
          set JAVA_EXE=java.exe
          %JAVA_EXE% -version >NUL 2>&1
          if "%ERRORLEVEL%" == "0" goto execute
          echo.
          echo ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH.
          echo.
          echo Please set the JAVA_HOME variable in your environment to match the
          echo location of your Java installation.
          goto fail
          :findJavaFromJavaHome
          set JAVA_HOME=%JAVA_HOME:"=%
          set JAVA_EXE=%JAVA_HOME%/bin/java.exe
          if exist "%JAVA_EXE%" goto execute
          echo.
          echo ERROR: JAVA_HOME is set to an invalid directory: %JAVA_HOME%
          echo.
          echo Please set the JAVA_HOME variable in your environment to match the
          echo location of your Java installation.
          goto fail
          :execute
          @rem Setup the command line
          set CLASSPATH=%APP_HOME%\gradle\wrapper\gradle-wrapper.jar
          @rem Execute Gradle
          "%JAVA_EXE%" %DEFAULT_JVM_OPTS% %JAVA_OPTS% %GRADLE_OPTS% "-Dorg.gradle.appname=%APP_BASE_NAME%" -classpath "%CLASSPATH%" org.gradle.wrapper.GradleWrapperMain %*
          :end
          @rem End local scope for the variables with windows NT shell
          if "%ERRORLEVEL%"=="0" goto mainEnd
          :fail
          set EXIT_CODE=%ERRORLEVEL%
          if "%EXIT_CODE%"=="0" set EXIT_CODE=1
          if not ""=="%GRADLE_EXIT_CONSOLE%" exit %EXIT_CODE%
          exit /b %EXIT_CODE%
          :mainEnd
          if "%OS%"=="Windows_NT" endlocal
          :omega
          EOF
          fi
          echo "✅ Gradle wrapper ready"

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      - name: Sync Capacitor
        run: |
          npx cap sync android
          echo "✅ Capacitor sync completed"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Find and upload APK
        run: |
          echo "🔍 Searching for APK files..."
          find android -name "*.apk" 2>/dev/null || echo "No APK found"
          # If APK found, copy to known location
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK found at expected location"
          else
            # Try to find any APK
            APK_FILE=$(find android -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$APK_FILE" ]; then
              echo "⚠️ APK found at: $APK_FILE"
              mkdir -p android/app/build/outputs/apk/release/
              cp "$APK_FILE" android/app/build/outputs/apk/release/app-release.apk
            fi
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ============ Windows 桌面应用构建 ============
  build-windows:
    name: 💻 Build Windows
    runs-on: windows-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm cache clean --force
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        shell: pwsh

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Electron (Windows)
        run: |
          npm run electron:build -- --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: release/
          retention-days: 7
          if-no-files-found: warn

  # ============ macOS 桌面应用构建 ============
  build-macos:
    name: 💻 Build macOS
    runs-on: macos-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean and install
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Electron (macOS)
        run: |
          npm run electron:build -- --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer
          path: release/
          retention-days: 7
          if-no-files-found: warn

  # ============ Docker 构建 ============
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/global-radio:latest
            ${{ secrets.DOCKER_USERNAME }}/global-radio:${{ github.ref_name || github.event.inputs.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Verify Docker push
        run: |
          echo "✅ Docker image pushed: ${{ secrets.DOCKER_USERNAME }}/global-radio:${{ github.ref_name || github.event.inputs.tag_name }}"
          echo "🔗 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/global-radio"

  # ============ 打包产物 ============
  package-artifacts:
    name: 📦 Package Artifacts
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: always()
    continue-on-error: true
    steps:
      - name: Create package directory
        run: mkdir -p release-packages

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: artifacts/windows/

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-installer
          path: artifacts/macos/

      - name: Copy artifacts
        run: |
          echo "📦 Copying artifacts..."
          if [ -d "artifacts/android" ] && [ "$(ls -A artifacts/android 2>/dev/null)" ]; then
            cp -v artifacts/android/*.apk release-packages/ 2>/dev/null || true
            echo "✅ Android APK copied"
          else
            echo "⚠️ No Android APK found"
          fi
          if [ -d "artifacts/windows" ] && [ "$(ls -A artifacts/windows 2>/dev/null)" ]; then
            cp -v artifacts/windows/*.exe release-packages/ 2>/dev/null || true
            echo "✅ Windows installer copied"
          else
            echo "⚠️ No Windows installer found"
          fi
          if [ -d "artifacts/macos" ] && [ "$(ls -A artifacts/macos 2>/dev/null)" ]; then
            cp -v artifacts/macos/*.dmg release-packages/ 2>/dev/null || true
            cp -v artifacts/macos/*.zip release-packages/ 2>/dev/null || true
            echo "✅ macOS installer copied"
          else
            echo "⚠️ No macOS installer found"
          fi
          echo "📦 Final packages:"
          ls -la release-packages/ || echo "No packages found"

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/
          retention-days: 7
          if-no-files-found: warn

  # ============ 创建 Release ============
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [package-artifacts]
    if: |
      always() && (
        github.ref_type == 'tag' || 
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "release_name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages/

      - name: List files
        run: |
          echo "📦 Release packages:"
          ls -la release-packages/ || echo "No files found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Deployment Summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
