name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# 关键修正：显式设置 Node 版本为 20 LTS，并兼容未来默认版本
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ github.actor == 'dependabot[bot]' && 'true' || 'false' }}

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 修正1：使用 Node 20 LTS，并确保即使未来默认版本变更也能工作
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 明确指定 Node 20 LTS
          cache: 'npm'
      
      # 修正2：如果锁文件不存在则自动生成
      - name: Ensure lock file exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "🔒 package-lock.json not found, generating..."
            npm install --package-lock-only
          else
            echo "✅ package-lock.json found."
          fi
      
      - name: Install dependencies
        run: npm ci || npm install # 降级方案：如果 npm ci 失败则使用 npm install
      
      - name: Build Web
        run: npm run build
      
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  # 其他 Job (build-electron, build-android, publish-docker) 同理修改...
  # 为简洁起见省略，但需要应用相同的修正
