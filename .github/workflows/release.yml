name: 📦 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Release Name'
        required: true
        default: 'Release v1.0.0'
        type: string

env:
  NODE_VERSION: 20
  NODE_OPTIONS: --max-old-space-size=4096
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  # ============ Web 构建 ============
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build Web
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ github.ref_name || github.event.inputs.tag_name }}

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ============ Android 构建 ============
  build-android:
    name: 📱 Build Android
    runs-on: ubuntu-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34'

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        continue-on-error: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ============ Windows 桌面应用构建 ============
  build-windows:
    name: 💻 Build Windows
    runs-on: windows-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean cache
        run: |
          npm cache clean --force
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Install dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Electron (Windows)
        run: |
          npm run electron:build -- --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: release/
          retention-days: 7
          if-no-files-found: warn

  # ============ macOS 桌面应用构建 ============
  build-macos:
    name: 💻 Build macOS
    runs-on: macos-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean cache
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Electron (macOS)
        run: |
          npm run electron:build -- --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer
          path: release/
          retention-days: 7
          if-no-files-found: warn

  # ============ Docker 构建 ============
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/global-radio:latest
            ${{ secrets.DOCKER_USERNAME }}/global-radio:${{ github.ref_name || github.event.inputs.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ============ 打包产物（压缩各平台安装包） ============
  package-artifacts:
    name: 📦 Package Artifacts
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: always()
    continue-on-error: true
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/
        continue-on-error: true

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows/
        continue-on-error: true

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/macos/
        continue-on-error: true

      - name: Create release package
        run: |
          mkdir -p release-packages
          
          # Android
          if [ -d "artifacts/android" ] && [ "$(ls -A artifacts/android)" ]; then
            cp artifacts/android/*.apk release-packages/ 2>/dev/null || true
          fi
          
          # Windows
          if [ -d "artifacts/windows" ] && [ "$(ls -A artifacts/windows)" ]; then
            cp artifacts/windows/*.exe release-packages/ 2>/dev/null || true
          fi
          
          # macOS
          if [ -d "artifacts/macos" ] && [ "$(ls -A artifacts/macos)" ]; then
            cp artifacts/macos/*.dmg release-packages/ 2>/dev/null || true
            cp artifacts/macos/*.zip release-packages/ 2>/dev/null || true
          fi
          
          echo "Files in release-packages:"
          ls -la release-packages/

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/
          retention-days: 7

  # ============ 创建 Release ============
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [package-artifacts]
    if: |
      always() && (
        github.ref_type == 'tag' || 
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "release_name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages/

      - name: List files
        run: |
          echo "📦 Release packages:"
          ls -la release-packages/ || echo "No files found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Deployment Summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
