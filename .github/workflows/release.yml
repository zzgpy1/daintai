name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 关键修正：禁用自动缓存，改为手动管理
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      # 修正1：先确保锁文件存在
      - name: Ensure lock file exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "🔒 Generating package-lock.json..."
            npm install --package-lock-only --no-audit --no-fund
          else
            echo "✅ package-lock.json found."
          fi
      
      # 修正2：使用 npm ci 但允许失败时降级
      - name: Install dependencies
        run: |
          if npm ci --no-audit --no-fund; then
            echo "✅ npm ci succeeded"
          else
            echo "⚠️ npm ci failed, falling back to npm install..."
            npm install --no-audit --no-fund
          fi
      
      # 修正3：手动缓存 node_modules（可选，提升速度）
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Build Web
        run: npm run build
      
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-electron:
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: AppImage
          - os: windows-latest
            target: nsis
          - os: macos-latest
            target: dmg
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Ensure lock file exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "🔒 Generating package-lock.json..."
            npm install --package-lock-only --no-audit --no-fund
          fi
      
      - name: Install dependencies
        run: |
          if npm ci --no-audit --no-fund; then
            echo "✅ npm ci succeeded"
          else
            echo "⚠️ npm ci failed, falling back to npm install..."
            npm install --no-audit --no-fund
          fi
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Build Electron
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: dist-electron/

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Ensure lock file exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "🔒 Generating package-lock.json..."
            npm install --package-lock-only --no-audit --no-fund
          fi
      
      - name: Install dependencies
        run: |
          if npm ci --no-audit --no-fund; then
            echo "✅ npm ci succeeded"
          else
            echo "⚠️ npm ci failed, falling back to npm install..."
            npm install --no-audit --no-fund
          fi
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Build Android
        run: npm run build:android
      
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  publish-docker:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: superneed/global-radio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [build-electron, build-android, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/electron-ubuntu-latest/*.AppImage
            artifacts/electron-windows-latest/*.exe
            artifacts/electron-macos-latest/*.dmg
            artifacts/android-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
