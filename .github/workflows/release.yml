name: 📦 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Release Name'
        required: true
        default: 'Release v1.0.0'
        type: string

env:
  NODE_VERSION: 20
  NODE_OPTIONS: --max-old-space-size=4096
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  # ============ Web 构建 ============
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build Web
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ github.ref_name || github.event.inputs.tag_name }}

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ============ Android 构建 ============
  build-android:
    name: 📱 Build Android
    runs-on: ubuntu-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34'

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Capacitor sync
        run: |
          echo "Checking android directory after sync:"
          ls -la android/
          ls -la android/app/ || echo "app directory not found"

      - name: Setup Gradle Wrapper
        run: |
          cd android
          
          # 如果 gradlew 不存在，创建它
          if [ ! -f "gradlew" ]; then
            echo "📦 Creating gradle wrapper..."
            # 下载 gradle-wrapper.jar
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.2/gradle/wrapper/gradle-wrapper.jar
            # 创建 gradle-wrapper.properties
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-all.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
            # 创建 gradlew 脚本
            cat > gradlew << 'EOF'
#!/bin/sh
exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
EOF
            chmod +x gradlew
            echo "✅ Gradle wrapper created"
          else
            echo "✅ gradlew already exists"
            chmod +x gradlew
          fi
          
          # 显示 gradle 版本
          ./gradlew --version || echo "Gradle wrapper check failed"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # 使用具体任务，避免 assembleRelease 依赖问题
          ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Check APK output
        run: |
          echo "🔍 Checking APK output..."
          find android -name "*.apk" 2>/dev/null | while read apk; do
            echo "Found APK: $apk"
            ls -la "$apk"
          done
          
          # 如果找不到 APK，检查构建输出
          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "⚠️ APK not found in expected location"
            echo "Contents of build directory:"
            find android/app/build -type f 2>/dev/null | head -20 || echo "Build directory not found"
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/**/*.apk
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

  # ============ Windows 桌面应用构建 ============
  build-windows:
    name: 💻 Build Windows
    runs-on: windows-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean cache
        run: |
          npm cache clean --force
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Install dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Electron (Windows)
        run: |
          npm run electron:build -- --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: release/
          retention-days: 7
          if-no-files-found: warn

  # ============ macOS 桌面应用构建 ============
  build-macos:
    name: 💻 Build macOS
    runs-on: macos-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean cache
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Electron (macOS)
        run: |
          npm run electron:build -- --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer
          path: release/
          retention-days: 7
          if-no-files-found: warn

  # ============ Docker 构建 ============
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: build-web
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/global-radio:latest
            ${{ secrets.DOCKER_USERNAME }}/global-radio:${{ github.ref_name || github.event.inputs.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ============ 打包产物 ============
  package-artifacts:
    name: 📦 Package Artifacts
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: always()
    continue-on-error: true
    steps:
      - name: Create package directory
        run: mkdir -p release-packages

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: artifacts/windows/

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-installer
          path: artifacts/macos/

      - name: Copy artifacts to release directory
        run: |
          echo "📦 Copying artifacts..."
          
          # Android
          if [ -d "artifacts/android" ] && [ "$(ls -A artifacts/android 2>/dev/null)" ]; then
            cp -v artifacts/android/*.apk release-packages/ 2>/dev/null || true
            echo "✅ Android APK copied"
          else
            echo "⚠️ No Android APK found"
          fi
          
          # Windows
          if [ -d "artifacts/windows" ] && [ "$(ls -A artifacts/windows 2>/dev/null)" ]; then
            cp -v artifacts/windows/*.exe release-packages/ 2>/dev/null || true
            echo "✅ Windows installer copied"
          else
            echo "⚠️ No Windows installer found"
          fi
          
          # macOS
          if [ -d "artifacts/macos" ] && [ "$(ls -A artifacts/macos 2>/dev/null)" ]; then
            cp -v artifacts/macos/*.dmg release-packages/ 2>/dev/null || true
            cp -v artifacts/macos/*.zip release-packages/ 2>/dev/null || true
            echo "✅ macOS installer copied"
          else
            echo "⚠️ No macOS installer found"
          fi
          
          echo ""
          echo "📦 Final packages:"
          ls -la release-packages/ || echo "No packages found"

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/
          retention-days: 7
          if-no-files-found: warn

  # ============ 创建 Release ============
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [package-artifacts]
    if: |
      always() && (
        github.ref_type == 'tag' || 
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "release_name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages/

      - name: List files
        run: |
          echo "📦 Release packages:"
          ls -la release-packages/ || echo "No files found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Deployment Summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "🐳 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/global-radio" >> $GITHUB_STEP_SUMMARY
