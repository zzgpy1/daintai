server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API代理（可选）
    location /api/ {
        proxy_pass http://radio-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 版本检查端点
    location /version/latest {
        add_header Content-Type application/json;
        return 200 '{
            "version": "2.0.0",
            "releaseDate": "2024-01-15",
            "changelog": ["新增睡眠定时器", "优化播放体验", "修复已知问题"],
            "downloadUrl": {
                "web": "https://globalradio.app",
                "windows": "https://github.com/globalradio/global-radio/releases/download/v2.0.0/GlobalRadio-Setup-2.0.0.exe",
                "mac": "https://github.com/globalradio/global-radio/releases/download/v2.0.0/GlobalRadio-2.0.0.dmg",
                "linux": "https://github.com/globalradio/global-radio/releases/download/v2.0.0/global-radio_2.0.0_amd64.AppImage",
                "android": "https://github.com/globalradio/global-radio/releases/download/v2.0.0/app-release.apk"
            },
            "mandatory": false
        }';
    }

    # 错误页面
    error_page 404 /index.html;
}
